    background:var(--paper); border:1px solid rgba(74,50,32,0.12);
    padding:16px 20px; font-weight:600; font-size:0.98rem; color:var(--ocean);
    box-shadow:0 2px 0 rgba(74,50,32,0.08);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .linkbtn:hover{transform:translateY(-3px); box-shadow:0 6px 14px rgba(74,50,32,0.15);}
  .linkbtn .icon{
    width:34px; height:34px; flex-shrink:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.05rem;
    background:var(--kraft);
  }
  .linkbtn.primary{background:var(--chili); color:var(--paper); box-shadow:0 3px 0 #4A2C15;}
  .linkbtn.primary .icon{background:rgba(251,246,234,0.2);}
